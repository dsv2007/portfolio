<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum AI | Redirecting</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #03040b;
            --accent-cyan: #00f0ff;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }
        
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; }
        
        .content {
            background: rgba(3, 4, 11, 0.8);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 240, 255, 0.1);
            animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        h1 { font-family: 'Outfit', sans-serif; font-size: 2.5rem; margin-bottom: 1rem; color: var(--accent-cyan); }
        p { color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; font-size: 1.1rem; }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            margin: 0 auto 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .btn {
            display: inline-block;
            background: var(--text-main);
            color: var(--bg-base);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { background: var(--accent-cyan); }
        .back-link { display: block; margin-top: 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: var(--text-main); }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="content">
        <div class="loader"></div>
        <h1>Quantum AI</h1>
        <p>You are being redirected to the official Quantum AI repository.<br>This is an open-source project featuring an AI Resume Analyzer & Neural Hyperparameter Hub.</p>
        <a href="https://github.com/dsv2007/quantum-ai" class="btn">Go to Repository Now</a>
        <a href="../../index.html" class="back-link">Cancel & Return to Portfolio</a>
    </div>

    <script>
        // Matrix Rain
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        
        function draw() {
            ctx.fillStyle = 'rgba(3, 4, 11, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00f0ff';
            ctx.font = fontSize + 'px monospace';
            
            for(let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        // Auto redirect after 3 seconds
        setTimeout(() => {
            window.location.href = 'https://github.com/dsv2007/quantum-ai';
        }, 3000);
    </script>
</body>
</html>

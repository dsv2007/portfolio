<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Boutique | Live Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --text-light: #f5f5f5;
            --gold: #c9a96e;
            --gold-hover: #b89759;
            --gray: #888888;
            --glass: rgba(20, 20, 20, 0.8);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }
        h1, h2, h3, .logo { font-family: 'Playfair Display', serif; }
        a { text-decoration: none; color: inherit; }
        
        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: var(--glass);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(201, 169, 110, 0.2);
        }
        .logo { font-size: 2rem; font-weight: 700; letter-spacing: 2px; color: var(--gold); }
        .back-link {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--gold);
            padding: 0.5rem 1.2rem;
            transition: all 0.3s;
        }
        .back-link:hover { background: var(--gold); color: var(--bg-dark); }
        
        /* Hero */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(10,10,10,0.6), rgba(10,10,10,0.8)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1920&q=80') center/cover;
        }
        .hero h1 { font-size: 4rem; margin-bottom: 1rem; opacity: 0; animation: fadeUp 1s 0.5s forwards; }
        .hero p { font-size: 1.2rem; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; opacity: 0; animation: fadeUp 1s 0.8s forwards; margin-bottom: 2rem; }
        .hero .btn { opacity: 0; animation: fadeUp 1s 1.1s forwards; }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .btn {
            display: inline-block;
            background: var(--gold);
            color: var(--bg-dark);
            padding: 1rem 2.5rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }
        .btn:hover { background: var(--gold-hover); transform: translateY(-2px); }
        
        /* Products */
        .shop { padding: 8rem 5%; }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 3rem; color: var(--gold); }
        
        .categories {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 4rem;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .cat-link { color: var(--gray); cursor: pointer; transition: color 0.3s; }
        .cat-link.active, .cat-link:hover { color: var(--gold); border-bottom: 1px solid var(--gold); }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 3rem;
        }
        .card {
            background: #111;
            padding-bottom: 1.5rem;
            transition: transform 0.4s;
            opacity: 0;
            transform: translateY(40px);
        }
        .card.visible { opacity: 1; transform: translateY(0); }
        .card:hover { transform: translateY(-10px); }
        .card-img {
            position: relative;
            overflow: hidden;
            aspect-ratio: 3/4;
            margin-bottom: 1.5rem;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s;
        }
        .card:hover img { transform: scale(1.05); }
        .add-cart {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 100%;
            background: rgba(201, 169, 110, 0.9);
            color: var(--bg-dark);
            text-align: center;
            padding: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: bottom 0.3s;
        }
        .card:hover .add-cart { bottom: 0; }
        .card-info { padding: 0 1rem; text-align: center; }
        .card-title { font-size: 1.3rem; margin-bottom: 0.5rem; font-weight: 400; }
        .card-price { color: var(--gold); font-family: 'Inter', sans-serif; }
        
        /* Cart Sidebar */
        .cart-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .cart-overlay.active { opacity: 1; pointer-events: all; }
        .cart-sidebar {
            position: fixed; top: 0; right: -400px; width: 400px; max-width: 100%; height: 100vh;
            background: var(--bg-dark); border-left: 1px solid rgba(201, 169, 110, 0.3);
            z-index: 1000; padding: 2rem; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
        }
        .cart-sidebar.active { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 1rem; margin-bottom: 2rem; }
        .close-cart { background: none; border: none; color: var(--text-light); font-size: 1.5rem; cursor: pointer; }
        .cart-items { flex-grow: 1; overflow-y: auto; }
        .cart-item { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .cart-item img { width: 80px; height: 100px; object-fit: cover; }
        .cart-item-info h4 { font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 0.5rem; }
        .cart-item-info p { color: var(--gold); }
        .cart-footer { border-top: 1px solid #333; padding-top: 2rem; margin-top: auto; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 1.5rem; font-family: 'Playfair Display', serif; }
        
        /* Footer */
        .footer { padding: 3rem 5%; text-align: center; border-top: 1px solid #222; margin-top: 4rem; color: var(--gray); font-size: 0.9rem; }
        .footer a { color: var(--gold); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">AURA</div>
        <a href="../../index.html" class="back-link">Back to Portfolio</a>
    </nav>

    <header class="hero">
        <p>The Art of Luxury</p>
        <h1>Elegance Redefined</h1>
        <button class="btn" onclick="document.getElementById('shop').scrollIntoView({behavior: 'smooth'})">Shop Collection</button>
    </header>

    <section id="shop" class="shop">
        <h2 class="section-title">Curated Collection</h2>
        <div class="categories">
            <span class="cat-link active">All</span>
            <span class="cat-link">Clothing</span>
            <span class="cat-link">Accessories</span>
            <span class="cat-link">Shoes</span>
        </div>
        
        <div class="grid" id="product-grid">
            <!-- Products injected by JS -->
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Bag</h2>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Subtotal</span>
                <span id="cart-total-price">₹0</span>
            </div>
            <button class="btn" style="width: 100%;">Checkout</button>
        </div>
    </div>

    <footer class="footer">
        <p>Built by Santhivarshini D | <a href="../../index.html">Portfolio Project</a></p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Noir Silk Blazer", price: 35000, img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "Crystal Evening Clutch", price: 18500, img: "https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "Velvet Stiletto Heels", price: 24000, img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "Golden Horizon Watch", price: 45000, img: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "Cashmere Trench Coat", price: 52000, img: "https://images.unsplash.com/photo-1539533018447-63fcce2678e3?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "Pearl Drop Earrings", price: 12500, img: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=600&q=80" }
        ];

        const grid = document.getElementById('product-grid');
        const cartSidebar = document.getElementById('cart-sidebar');
        const cartOverlay = document.getElementById('cart-overlay');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotalPrice = document.getElementById('cart-total-price');
        let cart = [];

        // Render Products
        products.forEach((p, i) => {
            const delay = i * 0.1;
            grid.innerHTML += `
                <div class="card" style="transition-delay: ${delay}s">
                    <div class="card-img">
                        <img src="${p.img}" alt="${p.name}">
                        <div class="add-cart" onclick="addToCart(${p.id})">Add to Bag</div>
                    </div>
                    <div class="card-info">
                        <h3 class="card-title">${p.name}</h3>
                        <p class="card-price">₹${p.price.toLocaleString()}</p>
                    </div>
                </div>
            `;
        });

        // Intersection Observer for scroll reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.card').forEach(card => observer.observe(card));

        // Cart Logic
        window.addToCart = (id) => {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
            openCart();
        };

        function updateCart() {
            cartItemsContainer.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                cartItemsContainer.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <p>₹${item.price.toLocaleString()}</p>
                        </div>
                    </div>
                `;
            });
            cartTotalPrice.textContent = `₹${total.toLocaleString()}`;
        }

        function openCart() {
            cartSidebar.classList.add('active');
            cartOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeCart() {
            cartSidebar.classList.remove('active');
            cartOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('close-cart').addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', closeCart);
    </script>
</body>
</html>
